openapi: 3.0.3
info:
  title: MangoTime API
  version: "0.1.0"
  description: >
    MangoTime shared-calendar API — v0 skeleton.
    Web, iOS and MCP clients all talk to this REST API; this spec is the contract.
servers:
  - url: http://localhost:8787
    description: Local dev (Mac mini)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe
      tags: [meta]
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok:
                    type: boolean
                    example: true
                  version:
                    type: string
                    example: "0.1.0"
  /v1/ping:
    get:
      operationId: ping
      summary: API ping
      tags: [meta]
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                required: [pong]
                properties:
                  pong:
                    type: boolean
                    example: true
  /v1/auth/register:
    post:
      operationId: register
      summary: Register with email + password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                displayName: { type: string }
      responses:
        "201": { description: "Created; returns { user, token }" }
        "400": { description: Validation error }
        "409": { description: Email already registered }
  /v1/auth/login:
    post:
      operationId: login
      summary: Login with email + password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: "OK; returns { user, token }" }
        "401": { description: Invalid credentials }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session token
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Logged out }
  /v1/me:
    get:
      operationId: getMe
      summary: Current user profile
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { description: Unauthorized }
    patch:
      operationId: updateMe
      summary: Update displayName / avatarUrl
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                avatarUrl: { type: string, nullable: true }
      responses:
        "200": { description: Updated user }
        "400": { description: Nothing to update }
        "401": { description: Unauthorized }
  /v1/calendars:
    post:
      operationId: createCalendar
      summary: Create calendar (creator membership auto-created; emits calendar.created)
      tags: [calendar]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                coverImageUrl: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: name missing }
        "401": { description: Unauthorized }
    get:
      operationId: listCalendars
      summary: List calendars the caller is a member of
      tags: [calendar]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ calendars: [...] } — membership-scoped" }
        "401": { description: Unauthorized }
  /v1/calendars/{id}:
    get:
      operationId: getCalendar
      summary: Get one calendar (members only; 404 for non-members)
      tags: [calendar]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Calendar }
        "404": { description: Not a member / not found }
    patch:
      operationId: updateCalendar
      summary: Rename / change cover (creator only; emits calendar.updated)
      tags: [calendar]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                coverImageUrl: { type: string, nullable: true }
      responses:
        "200": { description: Updated }
        "403": { description: Not the creator }
        "404": { description: Not a member / not found }
    delete:
      operationId: deleteCalendar
      summary: Delete calendar (creator only; emits calendar.deleted)
      tags: [calendar]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Not the creator }
        "404": { description: Not a member / not found }
tags:
  - name: meta
    description: Service metadata endpoints
  - name: auth
    description: Task 1.1 — registration, login, session tokens, profile
  - name: calendar
    description: Task 1.2 — calendar CRUD (membership-scoped; mutations emit OutboxEvent)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
