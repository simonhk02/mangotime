# MangoTime iOS CI — compile-only on GitHub macOS runners (no signing).
name: iOS Build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE_DIR=$(ls -d /Applications/Xcode*26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_DIR" ]; then XCODE_DIR=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using: $XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator (no signing)
        run: |
          set +e
          xcodebuild -project ios/MangoTime.xcodeproj -scheme MangoTime \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          STATUS=$?
          echo "===== UNIQUE ERRORS ====="
          grep -E "error:" build.log | sed 's/^.*error:/error:/' | sort -u | head -40
          echo "===== EXIT: $STATUS ====="
          exit $STATUS

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangotime-build-log
          path: build.log
          retention-days: 7
