# project.yml — MangoTime (iOS) XcodeGen spec
# Regenerate: cd ios && xcodegen generate
name: MangoTime

options:
  bundleIdPrefix: com.simonlai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MangoTime:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MangoTime
        excludes:
          - "Info.plist"
    info:
      path: MangoTime/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: MangoTime
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangotime.app
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        # DEVELOPMENT_TEAM comes from CI secrets at archive time.

  MangoTimeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MangoTimeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangotime.app.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MangoTime
    dependencies:
      - target: MangoTime

schemes:
  MangoTime:
    build:
      targets:
        MangoTime: all
        MangoTimeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MangoTimeUITests
    archive:
      config: Release
